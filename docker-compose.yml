services:
  netbox-mcp-server:
    # Use pre-built image from Docker Hub
    image: skuldgerry/netbox-mcp:latest
    
    container_name: netbox-mcp-server
    
    # Environment variables (no .env file required)
    environment:
      # Required: NetBox connection settings
      - NETBOX_URL=https://netbox.example.com/
      - NETBOX_TOKEN=your_api_token_here
      
      # Transport configuration (HTTP required for Docker)
      - TRANSPORT=http
      - HOST=0.0.0.0
      - PORT=8000

      # Strongly recommended for any network-accessible HTTP deployment.
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - MCP_AUTH_TOKEN=replace_with_a_random_secret

      # Browser clients only; JSON encoded list of allowed origins.
      - CORS_ORIGINS=["http://localhost:6274"]

      # Plugin discovery is opt-in. Discovered types remain read-only with empty rules.
      - ENABLE_PLUGIN_DISCOVERY=false
      - PLUGIN_WRITE_RULES={}
      
      # Optional: Security and logging
      - VERIFY_SSL=true
      - LOG_LEVEL=INFO
    
    # Expose HTTP port for MCP clients
    ports:
      - "8000:8000"
    
    # Restart policy
    restart: unless-stopped
    
    # Health check (optional - checks if HTTP server is responding)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
