name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include real NetBox or MCP tokens.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Server version or commit
    validations:
      required: true
  - type: input
    id: netbox-version
    attributes:
      label: NetBox version
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [stdio, Streamable HTTP]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and sanitized logs
    validations:
      required: true
