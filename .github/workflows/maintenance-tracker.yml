name: Maintenance tracker

on:
  workflow_run:
    workflows: [Tests, Maintenance, CodeQL]
    types: [completed]
  schedule:
    - cron: '53 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  pull-requests: read
  issues: write
  security-events: read

concurrency:
  group: maintenance-tracker
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always the trusted default branch, never the workflow_run PR revision.
      # No PR artifacts, cache, shell interpolation or PR code is consumed here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./scripts/maintenance_tracker.cjs')({github, context, core});
