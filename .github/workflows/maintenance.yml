name: Maintenance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tracker-probe:
    name: Maintenance reporter dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
      issues: read
      security-events: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            // Real API reads with the same read permissions as the reporter.
            // PR code receives a read-only token; issue writes are simulated.
            const writes = [];
            github.rest.issues.create = async args => { writes.push(args); return {data: {number: 0}}; };
            github.rest.issues.update = async args => { writes.push(args); return {data: {number: args.issue_number}}; };
            await require('./scripts/maintenance_tracker.cjs')({github, context, core});
            core.notice(`Reporter API reads passed; ${writes.length} simulated issue writes, no issue changed.`);

  container:
    name: Container build, protocol and security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build candidate (never push)
        run: docker build --pull --tag netbox-mcp:ci .
      - name: Test isolated container
        run: python3 scripts/container_smoke.py netbox-mcp:ci
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: netbox-mcp:ci
          scanners: vuln
          format: json
          output: candidate-scan.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Summarize and enforce security policy
        run: python3 scripts/security_report.py candidate-scan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candidate-security
          path: candidate-scan.json
          retention-days: 14

  published:
    name: Published image security
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pull published image and record immutable identity
        run: |
          docker pull skuldgerry/netbox-mcp:latest
          docker image inspect skuldgerry/netbox-mcp:latest --format '{{json .RepoDigests}}' > published-digest.json
      - name: Scan published image (not proof of what is deployed)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: skuldgerry/netbox-mcp:latest
          scanners: vuln
          format: json
          output: published-scan.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Summarize and enforce security policy
        run: python3 scripts/security_report.py published-scan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: published-security
          path: |
            published-scan.json
            published-digest.json
          retention-days: 14
